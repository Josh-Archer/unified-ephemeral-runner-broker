# Example Prometheus scrape configuration for the UECB broker.
# Prefer service annotations (Helm observability.prometheus.scrape=true) when
# using prometheus-operator or annotation-based discovery.

scrape_configs:
  - job_name: uecb-broker
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - unified-ephemeral-runner-broker.arc-systems.svc.cluster.local:8080
        labels:
          service: uecb-broker
    # Metric labels are limited to operational dimensions:
    # pool, backend, result, launch_mode, state, reason, route, method, status.
    # No repository, subject, owner, or secret values appear in labels.

