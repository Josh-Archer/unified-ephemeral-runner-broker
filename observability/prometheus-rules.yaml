groups:
  - name: uecb-broker
    rules:
      - alert: UECBDispatchLatencyHigh
        expr: histogram_quantile(0.95, sum by (le, pool) (rate(uecb_allocation_latency_seconds_bucket[10m]))) > 60
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "UECB dispatch latency is high for pool {{ $labels.pool }}"
          description: "The p95 allocation latency has been above 60 seconds for 15 minutes."

      - alert: UECBAllocationFailureRateHigh
        expr: |
          sum by (pool) (rate(uecb_allocations_total{result="failure"}[10m]))
            /
          clamp_min(sum by (pool) (rate(uecb_allocations_total[10m])), 0.001) > 0.05
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "UECB allocation failure rate is high for pool {{ $labels.pool }}"
          description: "More than 5 percent of allocation attempts are failing over the last 10 minutes."

      - alert: UECBCapacitySaturated
        expr: uecb_capacity_utilization_ratio > 0.9
        for: 20m
        labels:
          severity: warning
        annotations:
          summary: "UECB backend capacity is saturated for {{ $labels.pool }}/{{ $labels.backend }}"
          description: "Active allocations are consuming more than 90 percent of configured backend capacity."

      - alert: UECBQueueDepthStuck
        expr: sum by (pool) (uecb_queue_depth{state=~"reserved|ready"}) > 0
        for: 45m
        labels:
          severity: warning
        annotations:
          summary: "UECB allocations are not draining for pool {{ $labels.pool }}"
          description: "Reserved or ready allocations have remained active long enough to suggest cleanup or runner completion is stuck."

      - alert: UECBBackendCircuitOpen
        expr: uecb_backend_circuit_state{state="open"} == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "UECB backend circuit is open for {{ $labels.pool }}/{{ $labels.backend }}"
          description: "The broker is skipping this backend after repeated timeout, wait, throttling, transport, or server-error signals."

      - alert: UECBBackendRateLimited
        expr: sum by (pool, backend) (rate(uecb_backend_admission_rejections_total{reason="rate-limited"}[10m])) > 0.05
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "UECB backend admission is rate limited for {{ $labels.pool }}/{{ $labels.backend }}"
          description: "Cold-launch requests are being rejected by backend rate limiting."

      - alert: UECBOrphanCleanupElevated
        expr: sum by (pool, backend) (rate(uecb_orphan_cleanup_actions_total[15m])) > 0.01
        for: 20m
        labels:
          severity: warning
        annotations:
          summary: "UECB orphan cleanup is reclaiming stale runner labels for {{ $labels.pool }}/{{ $labels.backend }}"
          description: "Allocations are expiring without finalize (hard job kills or missing cleanup jobs). Check finalize-allocation usage and job_timeout bounds."

      - alert: UECBStaleRunnerLabels
        expr: sum by (pool, backend) (uecb_stale_runner_labels) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "UECB stale runner labels present for {{ $labels.pool }}/{{ $labels.backend }}"
          description: "Runner labels are overdue for sweep or held in quarantine after job-timeout without finalize."
