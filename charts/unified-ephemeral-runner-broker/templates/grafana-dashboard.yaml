{{- if .Values.observability.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "uecb.fullname" . }}-slo-dashboard
  labels:
    app.kubernetes.io/name: {{ include "uecb.name" . }}
    app.kubernetes.io/component: slo-dashboard
    grafana_dashboard: "1"
{{- with .Values.observability.dashboard.labels }}
{{ toYaml . | indent 4 }}
{{- end }}
  annotations:
    grafana_folder: {{ .Values.observability.dashboard.folder | default "UECB" | quote }}
data:
  uecb-slo.json: |
{{ .Files.Get "dashboards/uecb-slo.json" | indent 4 }}
{{- end }}
