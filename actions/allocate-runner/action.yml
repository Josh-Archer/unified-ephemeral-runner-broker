name: allocate-runner
description: Allocate an ephemeral runner from the unified broker and return the unique runner label.

inputs:
  broker_url:
    description: Base URL for the broker API
    required: true
  pool:
    description: Target pool name
    required: true
  backend:
    description: Optional backend pin
    required: false
  job_timeout:
    description: Requested job timeout duration, for example 15m
    required: false
    default: 15m
  labels:
    description: Optional comma-separated labels to attach to the allocation request
    required: false
    default: ""
  tenant:
    description: Optional tenant or queue identity for fair-share scheduling
    required: false
    default: ""
  priority_class:
    description: Optional priority class / lane, for example normal, high, deploy, pr, or smoke
    required: false
    default: ""
  required_capabilities:
    description: Optional comma-separated capability tags that the selected backend must advertise (for example docker, os:windows, arch:arm64)
    required: false
    default: ""
  excluded_capabilities:
    description: Optional comma-separated capability tags that the selected backend must not advertise
    required: false
    default: ""
  os:
    description: Optional runner OS dimension (linux, windows, macos). Merged into required_capabilities as os:<value> (aliases such as windows also work)
    required: false
    default: ""
  arch:
    description: Optional runner architecture dimension (amd64/x64, arm64). Merged into required_capabilities as arch:<value> (aliases such as arm64 and x64 also work)
    required: false
    default: ""
  oidc_audience:
    description: OIDC audience expected by the broker
    required: false
    default: uecb-broker
  allow_unauthenticated:
    description: Skip OIDC and call the broker without a bearer token
    required: false
    default: "false"
  queue_wait_timeout:
    description: How long to poll a pending queued allocation before failing, for example 5m
    required: false
    default: 5m

outputs:
  allocation_id:
    description: Broker allocation ID
    value: ${{ steps.allocate.outputs.allocation_id }}
  runner_label:
    description: Unique runner label returned by the broker
    value: ${{ steps.allocate.outputs.runner_label }}
  selected_backend:
    description: Backend selected by the broker
    value: ${{ steps.allocate.outputs.selected_backend }}
  expires_at:
    description: Allocation expiry timestamp
    value: ${{ steps.allocate.outputs.expires_at }}

runs:
  using: composite
  steps:
    - id: allocate
      shell: bash
      env:
        INPUT_BROKER_URL: ${{ inputs.broker_url }}
        INPUT_POOL: ${{ inputs.pool }}
        INPUT_BACKEND: ${{ inputs.backend }}
        INPUT_JOB_TIMEOUT: ${{ inputs.job_timeout }}
        INPUT_LABELS: ${{ inputs.labels }}
        INPUT_TENANT: ${{ inputs.tenant }}
        INPUT_PRIORITY_CLASS: ${{ inputs.priority_class }}
        INPUT_REQUIRED_CAPABILITIES: ${{ inputs.required_capabilities }}
        INPUT_EXCLUDED_CAPABILITIES: ${{ inputs.excluded_capabilities }}
        INPUT_OS: ${{ inputs.os }}
        INPUT_ARCH: ${{ inputs.arch }}
        INPUT_OIDC_AUDIENCE: ${{ inputs.oidc_audience }}
        INPUT_ALLOW_UNAUTHENTICATED: ${{ inputs.allow_unauthenticated }}
        INPUT_QUEUE_WAIT_TIMEOUT: ${{ inputs.queue_wait_timeout }}
      run: |
        set -euo pipefail

        auth_args=()
        if [ "${INPUT_ALLOW_UNAUTHENTICATED}" != "true" ]; then
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "GitHub OIDC environment variables are not available." >&2
            exit 1
          fi

          oidc_response="$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${INPUT_OIDC_AUDIENCE}")"
          id_token="$(printf '%s' "${oidc_response}" | python -c "import json,sys; print(json.load(sys.stdin)['value'])")"
          auth_args=(-H "Authorization: Bearer ${id_token}")
        fi

        request_body="$(python - <<'PY'
        import json
        import os

        payload = {
            "pool": os.environ["INPUT_POOL"],
            "job_timeout": os.environ["INPUT_JOB_TIMEOUT"],
        }

        backend = os.environ.get("INPUT_BACKEND", "").strip()
        if backend:
            payload["backend"] = backend

        labels = [item.strip() for item in os.environ.get("INPUT_LABELS", "").split(",") if item.strip()]
        if labels:
            payload["labels"] = labels

        tenant = os.environ.get("INPUT_TENANT", "").strip()
        if tenant:
            payload["tenant"] = tenant

        priority_class = os.environ.get("INPUT_PRIORITY_CLASS", "").strip()
        if priority_class:
            payload["priority_class"] = priority_class

        required_capabilities = [item.strip() for item in os.environ.get("INPUT_REQUIRED_CAPABILITIES", "").split(",") if item.strip()]

        # First-class platform dimensions merge into required_capabilities.
        # Bare values (windows, arm64) and canonical tags (os:windows, arch:arm64)
        # are both accepted; the broker canonicalizes aliases before matching.
        for env_name in ("INPUT_OS", "INPUT_ARCH"):
            value = os.environ.get(env_name, "").strip()
            if value and value not in required_capabilities:
                required_capabilities.append(value)

        if required_capabilities:
            payload["required_capabilities"] = required_capabilities

        excluded_capabilities = [item.strip() for item in os.environ.get("INPUT_EXCLUDED_CAPABILITIES", "").split(",") if item.strip()]
        if excluded_capabilities:
            payload["excluded_capabilities"] = excluded_capabilities

        print(json.dumps(payload))
        PY
        )"

        response="$(curl -fsSL "${auth_args[@]}" -H "Content-Type: application/json" -d "${request_body}" "${INPUT_BROKER_URL%/}/v1/allocations")"

        deadline="$(python - <<'PY'
        import os
        import re
        import time

        value = os.environ.get("INPUT_QUEUE_WAIT_TIMEOUT", "5m").strip()
        match = re.fullmatch(r"(\d+)([smh]?)", value)
        if not match:
            raise SystemExit(f"invalid queue_wait_timeout {value!r}")
        amount = int(match.group(1))
        unit = match.group(2) or "s"
        multiplier = {"s": 1, "m": 60, "h": 3600}[unit]
        print(int(time.time()) + amount * multiplier)
        PY
        )"

        while [ "$(printf '%s' "${response}" | python -c "import json,sys; print(json.load(sys.stdin).get('state',''))")" = "pending" ]; do
          now="$(date +%s)"
          if [ "${now}" -ge "${deadline}" ]; then
            echo "Timed out waiting for queued allocation to become ready." >&2
            printf '%s\n' "${response}" >&2
            exit 1
          fi
          allocation_id="$(printf '%s' "${response}" | python -c "import json,sys; print(json.load(sys.stdin)['allocation_id'])")"
          retry_after="$(export RESPONSE_JSON="${response}"; python - <<'PY'
        import datetime
        import json
        import os

        payload = json.loads(os.environ["RESPONSE_JSON"])
        value = payload.get("retry_after")
        if not value:
            print(5)
            raise SystemExit
        dt = datetime.datetime.fromisoformat(value.replace("Z", "+00:00"))
        now = datetime.datetime.now(datetime.timezone.utc)
        seconds = int((dt - now).total_seconds())
        print(max(1, min(seconds, 30)))
        PY
          )"
          sleep "${retry_after}"
          response="$(curl -fsSL "${auth_args[@]}" "${INPUT_BROKER_URL%/}/v1/allocations/${allocation_id}")"
        done

        state="$(printf '%s' "${response}" | python -c "import json,sys; print(json.load(sys.stdin).get('state',''))")"
        if [ "${state}" != "ready" ] && [ "${state}" != "" ]; then
          echo "Allocation did not become ready. Final state: ${state}" >&2
          printf '%s\n' "${response}" >&2
          exit 1
        fi

        echo "allocation_id=$(printf '%s' "${response}" | python -c "import json,sys; print(json.load(sys.stdin)['allocation_id'])")" >> "${GITHUB_OUTPUT}"
        echo "runner_label=$(printf '%s' "${response}" | python -c "import json,sys; print(json.load(sys.stdin)['runner_label'])")" >> "${GITHUB_OUTPUT}"
        echo "selected_backend=$(printf '%s' "${response}" | python -c "import json,sys; print(json.load(sys.stdin)['selected_backend'])")" >> "${GITHUB_OUTPUT}"
        echo "expires_at=$(printf '%s' "${response}" | python -c "import json,sys; print(json.load(sys.stdin)['expires_at'])")" >> "${GITHUB_OUTPUT}"
